<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap-glyphicons.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/python-visualization/folium/folium/templates/leaflet.awesome.rotate.min.css" />

    <meta
      name="viewport"
      content="width=device-width,
                initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      #map_8230f5587939f2885ed5da8710cbf274 {
        position: relative;
        width: 100%;
        height: 100%;
        left: 0%;
        top: 0%;
      }
      .leaflet-container {
        font-size: 1rem;
      }
    </style>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>

    <style>
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
      }
    </style>

    <script>
      L_NO_TOUCH = false;
      L_DISABLE_3D = false;
    </script>
  </head>
  <body>
    <div
      style="
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 9999;
        background: white;
        padding: 12px 16px;
        border: 1px solid #777;
        border-radius: 5px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        font-size: 13px;
      ">
      <b>Classificação dos municípios</b>
      <hr style="margin: 7px 0" />

      <div style="margin: 5px 0">
        <span style="display: inline-block; width: 12px; height: 12px; background: #808080; border: 1px solid #555; margin-right: 7px"></span>
        Classe 0: 1,951 municípios
      </div>

      <div style="margin: 5px 0">
        <span style="display: inline-block; width: 12px; height: 12px; background: #2878b5; border: 1px solid #555; margin-right: 7px"></span>
        Classe 1: 1,009 municípios
      </div>

      <div style="margin: 5px 0">
        <span style="display: inline-block; width: 12px; height: 12px; background: #2e9d62; border: 1px solid #555; margin-right: 7px"></span>
        Classe 2: 1,233 municípios
      </div>

      <div style="margin: 5px 0">
        <span style="display: inline-block; width: 12px; height: 12px; background: #f2c14e; border: 1px solid #555; margin-right: 7px"></span>
        Classe 3: 447 municípios
      </div>

      <div style="margin: 5px 0">
        <span style="display: inline-block; width: 12px; height: 12px; background: #d64545; border: 1px solid #555; margin-right: 7px"></span>
        Classe 4: 930 municípios
      </div>
    </div>

    <div class="folium-map" id="map_8230f5587939f2885ed5da8710cbf274"></div>
  </body>
  <script>
    var map_8230f5587939f2885ed5da8710cbf274 = L.map('map_8230f5587939f2885ed5da8710cbf274', {
      center: [-14.2, -51.9],
      crs: L.CRS.EPSG3857,
      ...{
        zoom: 4,
        zoomControl: true,
        preferCanvas: false,
      },
    });
    L.control.scale().addTo(map_8230f5587939f2885ed5da8710cbf274);

    var tile_layer_75b7e672e23d39f33aeb2f3b57153395 = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=cb1_4rfx_1_77e134656d9a7c9838805a24', {
      minZoom: 0,
      maxZoom: 18,
      maxNativeZoom: 18,
      noWrap: false,
      attribution: '\u00a9 OpenStreetMap contributors \u00a9 CARTO',
      subdomains: 'abc',
      detectRetina: false,
      tms: false,
      opacity: 1,
    });

    tile_layer_75b7e672e23d39f33aeb2f3b57153395.addTo(map_8230f5587939f2885ed5da8710cbf274);

    fetch('./municipios.json')
      .then((response) => {
        if (!response.ok) throw new Error(`Erro ao carregar municípios: ${response.status}`);
        return response.json();
      })
      .then((municipios) => {
        const cores = {
          0: '#808080',
          1: '#2878B5',
          2: '#2E9D62',
          3: '#F2C14E',
          4: '#D64545',
        };

        municipios.forEach((municipio) => {
          const cor = cores[municipio.classificacao] || '#808080';
          const marcador = L.circleMarker([municipio.latitude, municipio.longitude], {
            color: cor,
            fillColor: cor,
            fillOpacity: 0.85,
            radius: 3,
            weight: 1,
          }).addTo(map_8230f5587939f2885ed5da8710cbf274);

          marcador.bindPopup(`
                        <div style="width: 100%; height: 100%;">
                          <b>Código do município:</b> ${municipio.codigo}<br>
                          <b>Nome do município:</b> ${municipio.nome}<br>
                          <b>Classificação:</b> ${municipio.classificacao}<br>
                          <b>Latitude:</b> ${municipio.latitude.toFixed(6)}<br>
                          <b>Longitude:</b> ${municipio.longitude.toFixed(6)}
                        </div>
                      `);

          marcador.bindTooltip(`<div>${municipio.nome} — Classe ${municipio.classificacao}</div>`, { sticky: true });
        });
      })
      .catch((error) => console.error(error));
  </script>
</html>
